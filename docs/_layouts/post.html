{% if page.tags.size > 0 %}
<div class="post-tags">
    <span>Tags: </span>
    {% for tag in page.tags %}
    <!-- Links directly to the anchor on your central tags page -->
    <a href="{{ '/tags/' | relative_url }}#{{ tag | slugify }}">
        #{{ tag }}
    </a>{% unless forloop.last %}, {% endunless %}
    {% endfor %}
</div>
{% endif %}
